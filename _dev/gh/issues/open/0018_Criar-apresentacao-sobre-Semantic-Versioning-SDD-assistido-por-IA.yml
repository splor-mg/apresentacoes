# description

body: |-
  ### Descrição
  
  
  ### Descrição
  
  Montar a apresentação sobre Semantic Versioning em um contexto de SDD (Spec-Driven Development) assistido por IA. A ideia é schema de versionamento, comparar alternativas ao SemVer com CalVer, ZeroVer e hash, e explicitar como decidir entre MAJOR, MINOR e PATCH.
  
  No fim, apresentar a proposta do de pacote com CLI, num repositório da splor-mg, que levaria as normas de versão e usaria o Copilot para sugerir o incremento.
  
  ### Lista de atividades e/ou correções
  
  - [x] Adicionar `slides/20261028_sdd_semver.md`, com tema Dracula, no formato da apresentação do linktable
  - [x] Comparar SemVer, CalVer, ZeroVer e hash
  - [x] Explicar MAJOR, MINOR e PATCH, interface pública, pré-release e build metadata
  - [x] Incluir a proposta do CLI assistente e próximos passos
  - [x] Conferir a renderização com `poetry run task serve`
  
  ### Participantes
  
  @carloshob
  
