# description

body: |-
  ### Descrição
  
  Ver [log](https://github.com/splor-mg/apresentacoes/actions/runs/28053917375)
  
  O erro está acontecendo porque o ambiente virtual (.venv) que foi restaurado pelo cache está inconsistente e, quando o Poetry tenta recriá-lo, ele não reinstala as dependências.
  
  ```
  The virtual environment found in .../.venv seems to be broken.
  Recreating virtualenv apresentacoes in .../.venv
  
  Command not found: mkslides
  Command not found: task
  ```
  
  Isso indica que:
  
  O cache .venv foi recuperado.
  O Poetry detectou que ele está quebrado e criou um novo ambiente vazio.
  Como o passo Install dependencies foi pulado (cache-hit == true), mkslides e task nunca foram instalados.
  
  O problema está nesta lógica:
  ```
  - name: Install dependencies
    if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
    run: poetry install --no-interaction
  ```
  Se o cache existir, esse passo não roda, mesmo que o ambiente esteja corrompido.
